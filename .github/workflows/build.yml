name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project ZIP
        run: |
          curl -L -o project.zip "https://files.catbox.moe/8x4v9z.zip"
          unzip -o project.zip
          ls -la

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build Debug APK
        run: |
          cd DarkOrangeClockWidget
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: DarkOrangeClockWidget/app/build/outputs/apk/debug/app-debug.apk
